# Windows installer: tests, build, silent install and self-test of the installed app. tools/release.sh starts it
# by pushing the commit to a build/<sha> branch, then downloads the installer and signs it on the release machine.
name: windows-build
on:
  push:
    branches: ['build/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Build, test, install and self-test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_windows.ps1 -Test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installer
          path: dist/Z1PCB-*-setup.exe
          if-no-files-found: error
          retention-days: 7
